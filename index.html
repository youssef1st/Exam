<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exam7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-color: #f3efe9; /* خلفية دافئة كافيه فاتح مستوحاة من جو الصورة */
  --card-bg: #ffffff;
  --text-main: #2d241e;
  --text-muted: #786c61;
  --accent-gold: #c59b27;
  --accent-coffee: #4a3525;
  --border-color: #e6dfd5;
  --green: #10b981;
  --red: #f43f5e;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: 'Cairo', sans-serif;
  background: var(--bg-color);
  color: var(--text-main);
  padding: 35px 15px;
}

.exam-container {
  max-width: 840px;
  margin: 0 auto;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: 24px;
  padding: 35px;
  box-shadow: 0 15px 35px rgba(74, 53, 37, 0.06);
}

.exam-header {
  border-bottom: 2px solid var(--border-color);
  padding-bottom: 24px;
  margin-bottom: 30px;
  text-align: right;
}

.exam-header h2 {
  margin: 0 0 8px 0;
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--accent-coffee);
  letter-spacing: 0.5px;
}

.exam-meta {
  font-size: 15px;
  color: var(--text-muted);
  font-weight: 600;
  letter-spacing: 0.3px;
}

.question-box {
  margin-bottom: 24px;
  padding: 26px;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  background: #fbf9f6;
  transition: all 0.25s ease;
}

.question-box:hover {
  border-color: var(--accent-gold);
  box-shadow: 0 6px 16px rgba(197, 155, 39, 0.08);
  background: #ffffff;
}

.question-title {
  font-family: 'Playfair Display', serif;
  font-weight: 700;
  font-size: 18px;
  margin-bottom: 18px;
  line-height: 1.6;
  color: var(--accent-coffee);
  direction: ltr;
  text-align: left;
}

.options-list {
  display: flex;
  flex-direction: column;
  gap: 12px;
  direction: ltr;
}

.option-label {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border-color);
  border-radius: 12px;
  cursor: pointer;
  background: #ffffff;
  transition: all 0.2s ease;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-main);
  text-align: left;
}

.option-label:hover {
  border-color: var(--accent-gold);
  background: #fdfbf7;
}

.option-label input {
  accent-color: var(--accent-coffee);
  width: 18px;
  height: 18px;
}

.submit-btn {
  display: block;
  width: 100%;
  background: var(--accent-coffee);
  color: #fdfbf7;
  border: none;
  padding: 18px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 700;
  cursor: pointer;
  margin-top: 32px;
  transition: background 0.2s;
  box-shadow: 0 6px 15px rgba(74, 53, 37, 0.15);
  font-family: 'Cairo', sans-serif;
}

.submit-btn:hover {
  background: #36261b;
}

/* صفحات النتيجة وتوضيح الإجابات */
.result-card {
  background: #fbf9f6;
  border: 1px solid var(--border-color);
  border-radius: 16px;
  padding: 24px;
  margin-bottom: 20px;
}

.result-header-box {
  text-align: center;
  background: #f0fdf4;
  border: 1px solid #bbf7d0;
  padding: 28px;
  border-radius: 18px;
  margin-bottom: 30px;
}

.result-header-box h3 {
  color: #047857;
  margin: 0 0 10px 0;
  font-size: 26px;
  font-family: 'Playfair Display', serif;
}

.explanation {
  background: #ffffff;
  border-right: 4px solid var(--accent-gold);
  border-top: 1px solid var(--border-color);
  border-left: 1px solid var(--border-color);
  border-bottom: 1px solid var(--border-color);
  padding: 15px 18px;
  margin-top: 14px;
  font-size: 14px;
  color: #4a3525;
  border-radius: 10px;
  line-height: 1.6;
  direction: rtl;
  text-align: right;
}

.status-tag {
  display: inline-block;
  font-weight: 700;
  font-size: 13px;
  margin-bottom: 10px;
  padding: 5px 12px;
  border-radius: 6px;
}
.status-correct { color: #047857; background: #d1fae5; }
.status-wrong { color: #b91c1c; background: #fee2e2; }
</style>
</head>
<body>

<div class="exam-container">
  <div class="exam-header">
    <h2>CMath Exam</h2>
    <div class="exam-meta">Unit 1 • Multiple Choice Exam</div>
  </div>

  <div id="examContent">
    <div id="examQuestions"></div>
    <button class="submit-btn" onclick="submitExam()">تسليم الامتحان وإظهار النتيجة</button>
  </div>
  
  <div id="resultContainer" style="display: none;"></div>
</div>

<script>
const examData = [
  { q: "1. If x / 20 = 3 / 4, then x = ...", opts: ["5", "12", "15", "60"], ans: 2, exp: "نضرب تبادليًا: 4x = 20 × 3 = 60، إذن x = 60 ÷ 4 = 15." },
  { q: "2. If 1 / 2 = 3 / (x − 2), then x = ...", opts: ["8", "6", "2", "4"], ans: 0, exp: "بالضرب التبادلي: x − 2 = 6، إذن x = 8." },
  { q: "3. If 3^2 = 9^(b + 1), then (1 / 5)^b = ...", opts: ["5", "10", "25", "1"], ans: 3, exp: "بالضرب التبادلي والأسس: b = 5، إذن (1/5)^5 أو بالتطبيق المباشر الناتج النهائي 1." },
  { q: "4. Which of the following represents a proportion?", opts: ["5 / 3 ≠ 3 / 5", "4 / 7 = 8 / 14", "5 / 6 = 10 / 3", "2 / 3 = 6 / 4"], ans: 1, exp: "النسبة 8/14 تُبسط بقسمة البسط والمقام على 2 فتصبح 4/7؛ إذن النسبتان متساويتان." },
  { q: "5. If 2 : 5 = x : 15, then x = ...", opts: ["6", "30", "25", "45"], ans: 0, exp: "من 2/5 = x/15، بالضرب التبادلي 5x = 30، إذن x = 6." },
  { q: "6. If 3, m, 15, 10 are proportional, then m = ...", opts: ["3", "6", "4", "2"], ans: 3, exp: "لأن 3 : m = 15 : 10، بالضرب التبادلي 15m = 30، فيكون m = 2." },
  { q: "7. If a : 12 = 5 : 4, then a = ...", opts: ["20", "10", "15", "14.8"], ans: 2, exp: "a/12 = 5/4، إذن 4a = 60، وبالتالي a = 15." },
  { q: "8. Which pair of ratios is NOT proportional?", opts: ["1 / 8 and 4 / 32", "3 / 2 and 4 / 9", "1 / 5 and 16 / 80", "21 / 42 and 9 / 18"], ans: 1, exp: "3/2 = 1.5 بينما 4/9 لا تساوي 1.5، إذن هذا الزوج غير متناسب." },
  { q: "9. The ratio 2 / 5 is equal to the ratio ...", opts: ["1 / 10", "4 / 5", "6 / 15", "3 / 5"], ans: 2, exp: "نضرب البسط والمقام في 3: 2/5 = 6/15." },
  { q: "10. If 8 : 3 = 16 : x, then x = ...", opts: ["9", "3", "6", "24"], ans: 2, exp: "8/3 = 16/x، بالضرب التبادلي 8x = 48، إذن x = 6." },
  { q: "11. If 2 / y = x / 6, then (1 / 2)xy = ...", opts: ["12", "10", "9", "6"], ans: 3, exp: "بالضرب التبادلي: xy = 12، إذن (1/2)xy = 6." },
  { q: "12. If 18k = 6m, then m / k = ...", opts: ["1 / 3", "1 / 6", "3", "6"], ans: 2, exp: "نقسم الطرفين على 6k: m/k = 18/6 = 3." },
  { q: "13. If a scale drawing is greater than 1, it represents ...", opts: ["magnification", "minimization", "equality", "otherwise"], ans: 0, exp: "عندما تكون نسبة الرسم أكبر من 1، يكون الرسم أكبر من الحجم الحقيقي؛ وهذا يسمى magnification." },
  { q: "14. Which scale drawing expresses magnification?", opts: ["1 : 700", "7,000 : 1", "1 : 500", "1 : 7,000"], ans: 1, exp: "في مقياس الرسم، magnification يعني أن قيمة الرسم أكبر من الحقيقة؛ لذلك 7,000 : 1." },
  { q: "15. Which scale drawing expresses minimization?", opts: ["20 : 1", "1 : 2,000", "200 : 1", "2,000 : 1"], ans: 1, exp: "التصغير يكون فيه الرسم أصغر من الحقيقة؛ لذلك تكون النسبة أقل من 1 مثل 1 : 2,000." },
  { q: "16. The length in the drawing is 2 cm and the actual length is 6 metres. The scale is ...", opts: ["1 : 3", "1 : 30", "1 : 3,000", "1 : 300"], ans: 3, exp: "نحوّل 6 m إلى 600 cm. النسبة 2 : 600 = 1 : 300." },
  { q: "17. An insect is 0.4 mm long and its length after magnification is 6 cm. What is the magnification ratio?", opts: ["1 : 15", "15 : 1", "1 : 150", "150 : 1"], ans: 3, exp: "نحوّل 6 cm إلى 60 mm. نسبة الرسم إلى الحقيقي = 60 ÷ 0.4 = 150، إذن 150 : 1." },
  { q: "18. On a map, every 1 cm represents 5 km. If the actual distance is 25 km, the map distance is ...", opts: ["3 cm", "5 cm", "10 cm", "15 cm"], ans: 1, exp: "كل 1 cm يمثل 5 km، إذن 25 ÷ 5 = 5 cm." },
  { q: "19. A model is drawn to scale 1 : 1,000. If the model length is 7.4 cm, the real length is ... metres.", opts: ["7,400", "740", "75", "74"], ans: 3, exp: "الطول الحقيقي = 7.4 × 1,000 = 7,400 cm. نحول إلى متر بالقسمة على 100: 74 m." },
  { q: "20. Which scale means that every 1 cm in the drawing represents 6.5 km in reality?", opts: ["1 : 6,500,000", "1 : 6.5", "1 : 650,000", "1 : 6,500"], ans: 2, exp: "نحوّل 6.5 km إلى cm: 6.5 × 100,000 = 650,000 cm. إذن المقياس الصحيح 1 : 650,000." }
];

function renderExam() {
  const container = document.getElementById('examQuestions');
  container.innerHTML = '';
  examData.forEach((item, index) => {
    let optsHtml = '';
    item.opts.forEach((opt, optIdx) => {
      optsHtml += `
        <label class="option-label">
          <input type="radio" name="q${index}" value="${optIdx}">
          <span>${String.fromCharCode(65 + optIdx)}) ${opt}</span>
        </label>
      `;
    });
    container.innerHTML += `
      <div class="question-box">
        <div class="question-title">${index + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>
        <div class="options-list">${optsHtml}</div>
      </div>
    `;
  });
}

function submitExam() {
  let score = 0;
  let incorrectCount = 0;
  let reviewHtml = '';

  examData.forEach((item, index) => {
    const selected = document.querySelector(`input[name="q${index}"]:checked`);
    const selectedVal = selected ? parseInt(selected.value) : null;
    const isCorrect = selectedVal === item.ans;

    if (isCorrect) score++;
    else incorrectCount++;

    const userAnsText = selectedVal !== null ? `${String.fromCharCode(65 + selectedVal)}) ${item.opts[selectedVal]}` : "لم يتم الإجابة";
    const correctAnsText = `${String.fromCharCode(65 + item.ans)}) ${item.opts[item.ans]}`;

    reviewHtml += `
      <div class="result-card">
        <div class="status-tag ${isCorrect ? 'status-correct' : 'status-wrong'}">
          ${isCorrect ? 'Correct' : 'Incorrect'}
        </div>
        <div class="question-title">${index + 1}. ${item.q.replace(/^\d+\.\s*/, '')}</div>
        <div style="font-size: 14px; margin-bottom: 6px; direction: ltr; text-align: left;"><strong>Your answer:</strong> ${userAnsText}</div>
        <div style="font-size: 14px; margin-bottom: 10px; direction: ltr; text-align: left;"><strong>Correct answer:</strong> ${correctAnsText}</div>
        <div class="explanation">
          <strong>التوضيح:</strong><br>${item.exp}
        </div>
      </div>
    `;
  });

  const percentage = Math.round((score / 20) * 100);

  const finalReportHtml = `
    <div class="result-header-box">
      <h3>نتيجة الامتحان</h3>
      <div style="font-size: 28px; font-weight: bold; margin-bottom: 6px; color: #047857;" dir="ltr">${score} / 20</div>
      <div style="font-size: 16px; color: #334155;">${percentage}% • الدرجة الصحيحة: ${score} • الخطأ أو غير محلول: ${incorrectCount}</div>
      <p style="margin-top: 10px; font-size: 14px; color: #64748b;">راجع إجاباتك والشرح التوضيحي أدناه لتستفيد من أخطائك.</p>
    </div>
    ${reviewHtml}
  `;

  document.getElementById('examContent').style.display = 'none';
  const resContainer = document.getElementById('resultContainer');
  resContainer.innerHTML = finalReportHtml;
  resContainer.style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderExam();
</script>
</body>
</html>
